<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Toca Rouge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body class="page-404 tr-bg tr-bloom">
  <main class="wrap">
    <h1>That link didn't work</h1>
    <p class="subhead">The page you're after isn't here &mdash; but the party is.</p>
    <a class="cta" href="/" id="home-link">Get a ticket</a>
    <footer>
      <a href="/privacy.html">Privacy</a> &middot;
      <a href="/impressum.html">Legal</a>
    </footer>
  </main>
  <script>
    (function () {
      // A mangled link that still carries its campaign code should not lose the
      // code on the way back into the funnel.
      var src = (new URLSearchParams(window.location.search).get('src') || '').trim().slice(0, 64);
      var home = document.getElementById('home-link');
      if (src && home) {
        home.href = '/?src=' + encodeURIComponent(src);
      }
    })();
  </script>
</body>
</html>
