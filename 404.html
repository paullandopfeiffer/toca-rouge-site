<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Toca Rouge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e4002b'/%3E%3C/svg%3E">
<style>
  :root {
    /* ---- Toca Rouge identity tokens -------------------------------------
       This block is intentionally IDENTICAL on index.html, signup.html and
       privacy.html. The finished Hausmann/Polvo identity is due 2026-08-31;
       when it lands, this block is the only thing that changes, pasted once
       per page. Keeping the three in sync is worth one or two unused
       declarations per file.
       Current values are the v1 interim identity (brand/identity.md). ------ */
    --bg: #0b0b0c;
    --fg: #f5f5f5;
    --accent: #e4002b;
    /* #e4002b is 4.06:1 on --bg: fine for large text and for white-on-red
       buttons (4.85:1), below the 4.5:1 WCAG AA floor for small text. This
       tint is 6.60:1 and is used ONLY where red type is under ~18px. The
       brand red itself is never changed. */
    --accent-text: #ff5c77;
    --muted: #9a9a9a;
    --field: #1a1a1c;
    --border: #2c2c2f;
    /* --border is 1.41:1 on --bg: fine as a decorative edge on a filled
       surface, far below the 3:1 WCAG floor for a boundary that is the only
       thing identifying a control. --border-strong (3.71:1) is for those. */
    --border-strong: #6b6b70;
    --focus: #ffffff;
    --radius-pill: 999px;
    --radius-box: 8px;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-display: 'Bebas Neue', var(--font-body);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 6vw;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    letter-spacing: 0.03em;
    color: var(--accent);
    margin: 0 0 0.5rem;
  }
  .subhead {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 2.5rem;
  }
  .cta {
    display: inline-block;
    padding: 0.9rem 2.2rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.03em;
    border-radius: var(--radius-pill);
    font-size: 1.05rem;
    transition: opacity 0.15s ease;
  }
  .cta:hover { opacity: 0.85; }
  footer {
    margin-top: 3rem;
    font-size: 0.75rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }

  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>That link didn't work</h1>
    <p class="subhead">The page you're after isn't here &mdash; but the guestlist is.</p>
    <a class="cta" href="/" id="home-link">Get on the list</a>
    <footer>
      Balmes Balmes GbR &middot; <a href="/privacy.html">Privacy</a>
    </footer>
  </div>
  <script>
    (function () {
      // A mangled link that still carries its campaign code should not lose the
      // code on the way back into the funnel.
      var src = (new URLSearchParams(window.location.search).get('src') || '').trim().slice(0, 64);
      var home = document.getElementById('home-link');
      if (src && home) {
        home.href = '/?src=' + encodeURIComponent(src);
      }
    })();
  </script>
</body>
</html>
