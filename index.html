<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toca Rouge — Barcelona</title>
<meta name="description" content="Toca Rouge. House music, Barcelona. Be first to know about the next party.">
<link rel="canonical" href="https://tocarougebarcelona.com/">
<meta name="theme-color" content="#0b0b0c">
<!-- Link-preview card. WhatsApp is this campaign's main distribution channel and
     renders og:* — without these a shared link is a bare URL in the group. Copy is
     reused verbatim from <title> and the description above, not newly written. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Toca Rouge">
<meta property="og:url" content="https://tocarougebarcelona.com/">
<meta property="og:title" content="Toca Rouge — Barcelona">
<meta property="og:description" content="Toca Rouge. House music, Barcelona. Be first to know about the next party.">
<meta property="og:image" content="https://tocarougebarcelona.com/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Toca Rouge">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body class="page-home tr-bg tr-bloom">
  <main class="wrap">
    <!-- The brand name is artwork, not type: the delivered lockup as outlined
         vector, so it renders identically whatever fonts the visitor has. The
         <h1> stays so the page keeps a heading; its alt text is that heading. -->
    <h1 class="brand-lockup">
      <img src="/assets/logo/tocarouge-logo-red.svg" alt="Toca Rouge"
           width="268" height="105">
    </h1>
    <p class="details">House music.<br>Barcelona.</p>
    <p class="venue">Don't miss the next party.</p>
    <a class="cta" href="/signup.html" id="signup-link">Join the list</a>
    <footer>
      <a href="/privacy.html" id="privacy-link">Privacy</a> ·
      <a href="/impressum.html">Legal</a>
    </footer>
  </main>
  <script>
    (function () {
      // Carry ?src= through to the signup page. Without this, a campaign link
      // that lands here loses its attribution the moment someone clicks the
      // CTA — the form would record a blank ref and the code would be lost.
      var src = (new URLSearchParams(window.location.search).get('src') || '').trim().slice(0, 64);
      if (src) {
        document.getElementById('signup-link').href =
          '/signup.html?src=' + encodeURIComponent(src);
      }
    })();
  </script>
</body>
</html>
