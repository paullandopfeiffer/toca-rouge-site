<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get on the list — Toca Rouge</title>
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #f5f5f5;
    --accent: #d31027;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 6vh 6vw 6vh;
    text-align: center;
  }
  a.back {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover { color: var(--fg); }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    letter-spacing: 0.03em;
    color: var(--accent);
    margin: 0 0 0.5rem;
  }
  .subhead {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 2rem;
  }
  .frame-wrap {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
  }
  iframe {
    display: block;
    width: 100%;
    height: 960px;
    border: 0;
  }
  .fallback {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .fallback a { color: var(--accent); }
  .note {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Back</a>
    <h1>Almost there</h1>
    <p class="subhead">Fill this in and we'll take you straight to your ticket.</p>
    <div class="frame-wrap">
      <iframe id="signup-frame" src="https://docs.google.com/forms/d/e/1FAIpQLScM_ItIO17QPNIq5TFSShtKXKvBZAc43XQ4Zhh5KTzV0Czc0g/viewform?embedded=true">Loading…</iframe>
    </div>
    <p class="fallback">
      Already submitted and nothing happened?
      <a id="fallback-link" href="https://www.fourvenues.com/paul-pfeiffer/events/2908-29-08-2026-DJJ0">Continue to your ticket →</a>
    </p>
    <p class="note">
      We'll add you to our WhatsApp Community ourselves using the number you give us —
      no extra step needed.
    </p>
  </div>
  <script>
    // Google Forms has no built-in post-submit redirect. The iframe fires a
    // "load" event once for the blank form and again when it navigates
    // internally to its own "response recorded" screen after submission.
    // We count loads and redirect the whole page on the second one.
    (function () {
      var iframe = document.getElementById('signup-frame');
      var boris = document.getElementById('fallback-link').href;
      var loadCount = 0;
      var redirected = false;
      iframe.addEventListener('load', function () {
        loadCount++;
        if (loadCount > 1 && !redirected) {
          redirected = true;
          window.location.href = boris;
        }
      });
    })();
  </script>
</body>
</html>
