<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toca Rouge — Barcelona</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tocarougebarcelona.com/">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body class="page-404 tr-bg tr-bloom">
  <!-- Retired 2026-09-23, Paul: the UIC campus stickers are still up but this
       page advertised the 12 September Boris night, which has already happened.
       Forwards into the evergreen signup page (the one linked in the Instagram
       bio) instead, keeping the qr_uic attribution code so the sticker still
       counts in CAMPAIGNS. -->
  <main class="wrap">
    <h1>That party's happened</h1>
    <p class="subhead">But there's another one coming.</p>
    <a class="cta" href="/?src=qr_uic" id="home-link">Get on the list</a>
    <footer>
      <a href="/privacy.html">Privacy</a> &middot;
      <a href="/impressum.html">Legal</a>
    </footer>
  </main>
  <script>
    (function () {
      // Per-placement override, same as the retired page used to do: a sticker
      // whose own QR carries its own ?src= keeps that code instead of the
      // school-level default above.
      var src = (new URLSearchParams(window.location.search).get('src') || '').trim().slice(0, 64);
      var home = document.getElementById('home-link');
      if (src && home) {
        home.href = '/?src=' + encodeURIComponent(src);
      }
    })();
  </script>
</body>
</html>
