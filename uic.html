<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UIC opening party — Toca Rouge</title>
<meta name="description" content="UIC opening party. Toca Rouge at Boris, Barcelona, Sat 12 September. House music all night. Get on the guest list or join the Community.">
<link rel="canonical" href="https://tocarougebarcelona.com/uic.html">
<meta name="theme-color" content="#0b0b0c">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Toca Rouge">
<meta property="og:url" content="https://tocarougebarcelona.com/uic.html">
<meta property="og:title" content="UIC opening party — Toca Rouge">
<meta property="og:description" content="UIC opening party. Toca Rouge at Boris, Barcelona, Sat 12 September. House music all night. Get on the guest list or join the Community.">
<meta property="og:image" content="https://tocarougebarcelona.com/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Toca Rouge">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/brand.css">
</head>
<body class="page-qr tr-bg tr-bloom">
  <main class="wrap">
    <!-- Both arrival paths (the two UIC WhatsApp group links and the campus
         sticker QR) see the same opening as of 2026-08-31, Paul's call:
         "UIC OPENING PARTY" for both. The runtime intro-swap that used to
         show a sticker reveal to QR traffic is gone. This is where uic.html
         and esade.html stop being parallel -- esade.html still swaps in its
         "no Pilates class" reveal for QR scans. -->
    <div id="intro">
      <p class="eyebrow">UIC</p>
      <h1>UIC OPENING PARTY</h1>
      <p class="reveal-sub">Limited guestlist, sign up below.</p>
    </div>

    <section class="party" aria-labelledby="party-name">
      <h2 class="wordmark" id="party-name">
        <img src="/assets/logo/tocarouge-logo-red.svg" alt="Toca Rouge"
             width="268" height="105">
      </h2>
      <p class="details">Sep 12th 2026<br>Till 6 AM<br>Barcelona</p>
      <p class="venue">At Boris Club</p>
    </section>

    <div class="actions">
      <a class="cta primary" id="guestlist-link" href="/signup.html?src=qr_uic">
        Get on the list
      </a>
      <p class="cta-note">Takes about thirty seconds.</p>

      <a class="cta secondary"
         href="https://chat.whatsapp.com/FWIymebAuYi0KIpYEI03Yk"
         target="_blank" rel="noopener noreferrer">
        Join the WhatsApp Community<span class="visually-hidden"> (opens in a new tab)</span>
      </a>
      <p class="cta-note">Lineup, updates, and everyone else who is going.</p>
    </div>

    <footer>
      <a href="/privacy.html">Privacy</a> &middot;
      <a href="/impressum.html">Legal</a>
    </footer>
  </main>
  <script>
    (function () {
      // Per-placement attribution. The default in the href above is the
      // school-level code; if a sticker's QR carries its own ?src= (one code
      // per corkboard, so placements can be compared) that value wins and is
      // forwarded to the form instead.
      //
      // Sanitised exactly as signup.html does it: trimmed and length-capped,
      // and nothing else. No lowercasing, no filtering, no rejection, because
      // codes are matched exactly against their source of truth and an
      // unrecognised one must still reach the sheet intact.
      var src = (new URLSearchParams(window.location.search).get('src') || '')
                  .trim().slice(0, 64);
      var link = document.getElementById('guestlist-link');
      if (src && link) {
        link.href = '/signup.html?src=' + encodeURIComponent(src);
      }
    })();
  </script>
</body>
</html>
